---
- name: Configure all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge
    - slurm_common
    - node_exporter
    - grafana_repo
    - promtail

- name: Configure head node services
  hosts: headnode
  become: true
  roles:
    - mariadb
    - nfs_server
    - slurm_ctld
    - prometheus_slurm_exporter
    - docker
    - observability_stack

- name: Configure worker nodes
  hosts: workers
  become: true
  roles:
    - nfs_client
    - slurm_d
    - cgroup_exporter

# NFS(/apps)가 head/worker 양쪽 다 준비된 뒤에 실행. 
# apptainer 롤이 /apps/containers를 만드는데, NFS 마운트보다 먼저 돌면 워커에서 로컬 디스크에 만들어져 헤드와 다른 디렉터리가 됨.
- name: Configure execution environment (all nodes)
  hosts: cluster
  become: true
  roles:
    - apptainer
