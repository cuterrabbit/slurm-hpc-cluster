---
- name: Configure all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge
    - slurm_common

- name: Configure head node services
  hosts: headnode
  become: true
  roles:
    - mariadb
    - nfs_server
    - slurm_ctld

- name: Configure worker nodes
  hosts: workers
  become: true
  roles:
    - nfs_client
    - slurm_d
