---
- name: Configure all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge
    - slurm_common
    - node_exporter
    - grafana_repo
    - promtail
    - network_gateway

- name: Configure head node services
  hosts: headnode
  become: true
  roles:
    - docker
    - mariadb_stack
    - mariadb_backup
    - nfs_server
    - slurm_ctld
    - prometheus_slurm_exporter
    - observability_stack

- name: Configure worker nodes
  hosts: workers
  become: true
  roles:
    - nfs_client
    - slurm_d
    - cgroup_exporter

- name: Configure execution environment (all nodes)
  hosts: cluster
  become: true
  roles:
    - apptainer

- name: Deploy workloads onto shared storage
  hosts: headnode
  become: true
  roles:
    - workload_deploy
