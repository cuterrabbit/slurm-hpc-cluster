---
- name: Configure all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge
    - slurm_common
    - node_exporter
    - grafana_repo
    - promtail

- name: Configure head node services
  hosts: headnode
  become: true
  roles:
    - mariadb
    - nfs_server
    - slurm_ctld
    - prometheus_slurm_exporter
    - prometheus
    - alertmanager
    - loki
    - grafana

- name: Configure worker nodes
  hosts: workers
  become: true
  roles:
    - nfs_client
    - slurm_d
    - cgroup_exporter
