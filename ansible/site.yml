---
- name: Configure all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge
    - slurm_common
    - node_exporter
    - grafana_repo
    - promtail
    - network_gateway

- name: Configure head node services
  hosts: headnode
  become: true
  roles:
    - docker
    - mariadb_stack
    - nfs_server
    - slurm_ctld
    - prometheus_slurm_exporter
    - observability_stack

- name: Configure worker nodes
  hosts: workers
  become: true
  roles:
    - nfs_client
    - slurm_d
    - cgroup_exporter

# NFS(/apps)가 head/worker 양쪽 다 준비된 뒤에 실행되어야 함 — apptainer 롤이
# /apps/containers를 만드는데, NFS 마운트보다 먼저 돌면 워커에서 로컬
# 디스크에 만들어져 헤드와 다른 디렉터리가 됨.
- name: Configure execution environment (all nodes)
  hosts: cluster
  become: true
  roles:
    - apptainer

# 헤드에서만 실행 — /apps는 헤드의 실제 로컬 스토리지(NFS export 원본)라
# 여기 배포한 코드/이미지가 워커에는 마운트를 통해 그대로 보인다.
# apptainer(빌드 도구)와 NFS(/apps) 둘 다 준비된 뒤에 실행돼야 한다.
- name: Deploy workloads onto shared storage
  hosts: headnode
  become: true
  roles:
    - workload_deploy
