---
- name: Ensure slurmctld/slurmdbd packages are installed
  ansible.builtin.apt:
    name:
      - slurmctld
      - slurmdbd
      - slurm-wlm-mysql-plugin
    state: present
    update_cache: true

- name: Ensure StateSaveLocation exists
  ansible.builtin.file:
    path: /var/spool/slurmctld
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Deploy slurmdbd.conf
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: '0600'
  no_log: true
  notify: Restart slurmdbd

- name: Ensure slurmdbd is enabled and running
  ansible.builtin.systemd_service:
    name: slurmdbd
    enabled: true
    state: started

- name: Ensure slurmctld is enabled and running
  ansible.builtin.systemd_service:
    name: slurmctld
    enabled: true
    state: started
