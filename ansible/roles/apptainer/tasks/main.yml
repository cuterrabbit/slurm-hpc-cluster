---
# squashfuse/fuse2fs: 언프리빌리지드 SIF 마운트에 필요 (ADR-0010)
- name: Ensure apptainer and FUSE mount helpers are installed
  ansible.builtin.apt:
    name:
      - apptainer=1.4.5-1
      - squashfuse
      - fuse2fs
    state: present
    update_cache: true

- name: Ensure shared container image directory exists
  ansible.builtin.file:
    path: /apps/containers
    state: directory
    owner: root
    group: root
    mode: '0755'

# AppArmor userns 제한 우회, apptainer 바이너리 하나로만 범위 한정 (ADR-0010)
- name: Deploy AppArmor profile allowing apptainer unprivileged user namespaces
  ansible.builtin.copy:
    src: apptainer-apparmor.profile
    dest: /etc/apparmor.d/apptainer
    owner: root
    group: root
    mode: '0644'
  notify: Reload apparmor
