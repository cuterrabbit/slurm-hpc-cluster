---
# 언프리빌리지드 컨테이너 추출은 유저 네임스페이스가 필요한데, 이 커널은 AppArmor로 unprivileged user namespace를 막아뒀다
# 이 제한을 풀지 않고, FUSE 기반 마운트(squashfuse/fuse2fs)로 우회한다 — 시스템 전역 보안 설정은 그대로 둔 채 필요한 패키지만 추가하는 쪽.
- name: Ensure apptainer and FUSE mount helpers are installed
  ansible.builtin.apt:
    name:
      - apptainer=1.4.5-1
      - squashfuse
      - fuse2fs
    state: present
    update_cache: true

- name: Ensure shared container image directory exists
  ansible.builtin.file:
    path: /apps/containers
    state: directory
    owner: root
    group: root
    mode: '0755'

# Ubuntu 23.10+는 AppArmor로 unprivileged user namespace 생성을 차단. 
# apptainer는 setuid 없이 컨테이너를 실행할 때 이 네임스페이스가 필요, apptainer의 starter 바이너리에만 userns 권한을 허용하는 AppArmor 프로필을 별도로 등록.
# 시스템 전역 sysctl은 그대로 둔다 (다른 프로세스의 unprivileged userns는 계속 막힌 채로 유지).
- name: Deploy AppArmor profile allowing apptainer unprivileged user namespaces
  ansible.builtin.copy:
    src: apptainer-apparmor.profile
    dest: /etc/apparmor.d/apptainer
    owner: root
    group: root
    mode: '0644'
  notify: Reload apparmor
