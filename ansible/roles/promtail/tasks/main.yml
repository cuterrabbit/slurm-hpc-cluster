---
- name: Ensure promtail is installed
  ansible.builtin.apt:
    name: promtail
    state: present
    update_cache: true

- name: Ensure acl tools are installed
  ansible.builtin.apt:
    name: acl
    state: present

- name: Ensure promtail data directory exists
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: nogroup
    mode: '0750'

- name: Ensure Tetragon enriched log directory exists (for ACL target parity)
  ansible.builtin.file:
    path: /var/log/tetragon-enriched
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Grant promtail read access to existing files under log directories
  ansible.posix.acl:
    path: "{{ item }}"
    entity: promtail
    etype: user
    permissions: rX
    state: present
    recursive: true
  loop:
    - /var/log/slurm
    - /var/log/munge
    - /var/log/tetragon-enriched

- name: Grant promtail default read access for future log files
  ansible.posix.acl:
    path: "{{ item }}"
    entity: promtail
    etype: user
    permissions: rX
    state: present
    default: true
  loop:
    - /var/log/slurm
    - /var/log/munge
    - /var/log/tetragon-enriched

- name: Deploy promtail config.yml
  ansible.builtin.template:
    src: promtail_config.yml.j2
    dest: /etc/promtail/config.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart promtail

- name: Ensure promtail is enabled and running
  ansible.builtin.systemd_service:
    name: promtail
    enabled: true
    state: started
