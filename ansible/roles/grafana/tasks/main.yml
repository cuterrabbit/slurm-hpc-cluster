---
- name: Ensure grafana is installed
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Set Grafana admin password via environment override
  ansible.builtin.lineinfile:
    path: /etc/default/grafana-server
    regexp: ^GF_SECURITY_ADMIN_PASSWORD=
    line: "GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}"
    create: true
    owner: root
    group: root
    mode: '0640'
  no_log: true
  notify: Restart grafana

- name: Ensure Grafana datasources provisioning directory exists
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: prometheus_datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart grafana

- name: Ensure grafana-server is enabled and running
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started
