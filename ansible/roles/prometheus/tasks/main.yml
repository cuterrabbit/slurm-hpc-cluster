---
- name: Ensure prometheus is installed
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true

- name: Ensure prometheus rules directory exists
  ansible.builtin.file:
    path: /etc/prometheus/rules.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/promtool check config %s
  notify: Restart prometheus

- name: Deploy alert rules
  ansible.builtin.template:
    src: alert_rules.yml.j2
    dest: /etc/prometheus/rules.d/alert_rules.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart prometheus

- name: Ensure prometheus is enabled and running
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
