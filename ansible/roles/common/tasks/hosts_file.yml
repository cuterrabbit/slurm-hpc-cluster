---
- name: Populate /etc/hosts with cluster node entries
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^[0-9.]+\s+{{ item }}$'
    line: "{{ hostvars[item].ansible_host | default('127.0.0.1') }} {{ item }}"
    state: present
    unsafe_writes: true
  loop: "{{ groups['cluster'] }}"
