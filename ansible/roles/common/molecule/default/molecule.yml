---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  inventory:
    # ansible_host는 일부러 안 건드린다 — Docker 드라이버가 exec 연결에 내부적으로
    # 쓰는 값이라, 여기서 덮어쓰면 컨테이너 연결 자체가 깨진다(실제로 겪은 문제).
    hosts:
      cluster:
        hosts:
          instance: {}
    group_vars:
      all:
        ansible_remote_tmp: /tmp/.ansible-remote/tmp
        common_shared_user: hpcuser
        common_shared_uid: 2000
        common_shared_gid: 2000
        common_ssh_password_authentication: false
verifier:
  name: ansible
