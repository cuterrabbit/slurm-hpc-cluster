---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check hpcuser UID/GID
      ansible.builtin.command: id hpcuser
      register: hpcuser_id
      changed_when: false
      failed_when: >-
        'uid=2000(hpcuser) gid=2000(hpcuser)' not in hpcuser_id.stdout

    - name: Check /etc/hosts contains this node's entry
      ansible.builtin.command: grep -q '127.0.0.1 instance' /etc/hosts
      changed_when: false

    - name: Check SSH hardening drop-in disables password auth
      ansible.builtin.command: >-
        grep -q 'PasswordAuthentication no'
        /etc/ssh/sshd_config.d/99-hardening.conf
      changed_when: false

    - name: Check chrony is active
      ansible.builtin.command: systemctl is-active chrony
      register: chrony_status
      changed_when: false
      failed_when: chrony_status.stdout != "active"
