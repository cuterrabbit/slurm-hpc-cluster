---
name: CI/CD

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ansible ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [common, munge]
    defaults:
      run:
        working-directory: ansible/roles/${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ansible molecule "molecule-plugins[docker]" docker

      - name: Molecule test (${{ matrix.role }})
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          # 또 실패하면 바로 원인 볼 수 있게 verbose 로그 켜둠
          ANSIBLE_VERBOSITY: "3"

  deploy:
    needs: [lint, molecule]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, slurm-head]
    env:
      VAULT_PASS_FILE: /tmp/ci_vault_pass.txt
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - name: Write vault password file
        run: echo "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASS_FILE"
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Run site.yml
        run: ansible-playbook site.yml --vault-password-file "$VAULT_PASS_FILE"

      - name: Clean up vault password file
        if: always()
        run: rm -f "$VAULT_PASS_FILE"
