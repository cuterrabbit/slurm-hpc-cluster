name: Deploy to cluster

# 셀프호스티드 러너에서 돈다. pull_request로는 절대 트리거하지 않는다 —
# 포크 PR이 이 잡을 실행시킬 경로 자체를 없애기 위함 (퍼블릭 리포이므로).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, slurm-head]
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - name: Write vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/vault_pass.txt"

      - name: Run site.yml
        run: ansible-playbook site.yml --vault-password-file "$RUNNER_TEMP/vault_pass.txt"

      - name: Clean up vault password file
        if: always()
        run: rm -f "$RUNNER_TEMP/vault_pass.txt"
